name: Board daily seed

on:
  schedule:
    # 每天 18:10 北京（UTC+8）= 10:10 UTC，比热榜晚一点，避免抢资源
    - cron: '10 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-daily
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Seed board (10~20 条)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/seed_board_daily.py
