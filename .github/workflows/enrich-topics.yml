name: Enrich topics with AI

on:
  schedule:
    # 每天 17:30 北京（UTC 09:30）—— 和热歌同一个点
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制全量重跑（默认 30 天内不重复）"
        required: false
        default: "true"
  push:
    paths:
      - 'scripts/refresh_hot_topics.py'
      - 'scripts/geng_seed.json'

permissions:
  contents: write
  models: read

concurrency:
  group: enrich-topics
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Enrich topics
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 scripts/enrich_topics.py --force
          else
            python3 scripts/enrich_topics.py --force
          fi

      # 抓当日热榜并写入往期归档 hot/YYYY-MM-DD.json
      # 之前这一步完全没跑过，所以「往期」永远只有手动生成的那一天
      - name: Refresh hot topics + archive
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python3 scripts/refresh_hot_topics.py

      - name: Commit if changed
        run: |
          git config user.name "beforeglow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics_ai.json
          git add hot_topics.json 2>/dev/null || true
          if [ -d hot ]; then git add hot; fi
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: enrich topics $(date -u +%F)"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          sleep 8
          curl -fsS "https://purge.jsdelivr.net/gh/1164118805/beforeglow-daily@main/topics_ai.json" || true
