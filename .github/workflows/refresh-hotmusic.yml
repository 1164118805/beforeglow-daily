name: Refresh Douyin hot music

on:
  schedule:
    # 06:30 Asia/Shanghai (UTC+8) -> 22:30 UTC previous day
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-hotmusic
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build hotmusic.json
        run: python3 scripts/refresh_hotmusic.py

      - name: Commit if changed
        run: |
          git config user.name "beforeglow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotmusic.json
          if git diff --staged --quiet; then
            echo "no change today"
          else
            git commit -m "chore: refresh douyin hot music $(date -u +%F)"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          sleep 10
          curl -fsS "https://purge.jsdelivr.net/gh/1164118805/beforeglow-daily@main/hotmusic.json" || true
