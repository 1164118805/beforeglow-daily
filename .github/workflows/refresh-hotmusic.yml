name: Refresh hot music and topics

on:
  schedule:
    # 17:30 Asia/Shanghai (UTC+8) = 09:30 UTC
    - cron: '30 9 * * *'   # 17:30 北京
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: refresh-hot-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build hotmusic.json
        run: python3 scripts/refresh_hotmusic.py

      - name: Build hot_topics.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python3 scripts/refresh_hot_topics.py

      - name: Enrich topics (30 天内不重复)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python3 scripts/enrich_topics.py

      - name: Daily AI (信 + 话术补包)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python3 scripts/refresh_daily_ai.py

      - name: Commit if changed
        run: |
          git config user.name "beforeglow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotmusic.json hot_topics.json
          if [ -f letters_ai.json ]; then git add letters_ai.json; fi
          if [ -f says_ai.json ]; then git add says_ai.json; fi
          if [ -f daily_ai.json ]; then git add daily_ai.json; fi
          if [ -f topics_ai.json ]; then git add topics_ai.json; fi
          if git diff --staged --quiet; then
            echo "no change today"
          else
            git commit -m "chore: refresh hot data $(date -u +%F)"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          sleep 10
          curl -fsS "https://purge.jsdelivr.net/gh/1164118805/beforeglow-daily@main/hotmusic.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/1164118805/beforeglow-daily@main/hot_topics.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/1164118805/beforeglow-daily@main/topics_ai.json" || true
